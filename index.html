<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cute Surprise for You</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-wrap">
    <div class="sparkles"></div>
    <header class="hero">
      <div class="title-block">
        <h1>Hey BABU 💖</h1>
        <p>Just a little cute surprise for my love</p>
      </div>
      <div class="gif-card">
        <div class="cute-animation main-animation">
          <span class="big-emoji">💖</span>
          <span class="big-emoji big-emoji--2">💕</span>
          <span class="small-emoji">✨</span>
        </div>
      </div>
    </header>

    <section class="message-card">
      <div class="text-glow">
        <p>Every moment with you feels like magic.</p>
        <p>I hope this page makes you smile as much as you make me smile.</p>
      </div>
      <div class="button-row">
        <button id="showLove">Show Me More</button>
      </div>
    </section>

    <section class="extra-panel hidden" id="extraPanel">
      <div class="extra-gifs">
        <div class="extra-card">
          <div class="cute-animation mini-animation">
            <span class="mini-emoji">💫</span>
            <span class="mini-emoji">💞</span>
          </div>
          <span>YOU'RE MY SUNSHINE✨</span>
        </div>
        <div class="extra-card">
          <div class="cute-animation mini-animation">
            <span class="mini-emoji">🎀</span>
            <span class="mini-emoji">🩰</span>
          </div>
          <span>My LOVE  💃</span>
        </div>
        <div class="extra-card">
          <div class="cute-animation mini-animation">
            <span class="mini-emoji">🤗</span>
            <span class="mini-emoji">🌸</span>
          </div>
          <span>MISS YOU ALOT  🤗</span>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
